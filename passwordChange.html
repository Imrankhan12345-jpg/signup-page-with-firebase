<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Security Center</title>
    
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root[data-theme="dark"] {
            --bg-main: #050814;
            --card-bg: rgba(10, 15, 30, 0.82);
            --card-border: rgba(56, 189, 248, 0.25);
            --text-primary: #f8fafc;
            --text-secondary: #38bdf8;
            --text-muted: #64748b;
            --user-card-bg: rgba(30, 41, 59, 0.4);
            --user-card-hover: rgba(30, 41, 59, 0.75);
            --user-card-border: rgba(255, 255, 255, 0.08);
            --primary-btn-bg: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 50%, #4f46e5 100%);
            --toggle-bg: rgba(15, 23, 42, 0.85);
            --toggle-border: rgba(56, 189, 248, 0.3);
            --toggle-hover: rgba(30, 41, 59, 1);
            --badge-bg: rgba(56, 189, 248, 0.12);
            --badge-border: rgba(56, 189, 248, 0.3);
            --divider-color: linear-gradient(90deg, rgba(56, 189, 248, 0) 0%, rgba(56, 189, 248, 0.4) 50%, rgba(56, 189, 248, 0) 100%);
            --glow-1: #00d2ff;
            --glow-2: #6366f1;
            --glow-opacity: 0.4;
        }

        :root[data-theme="light"] {
            --bg-main: #edf2f7;
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-border: rgba(37, 99, 235, 0.2);
            --text-primary: #0f172a;
            --text-secondary: #2563eb;
            --text-muted: #64748b;
            --user-card-bg: rgba(241, 245, 249, 0.9);
            --user-card-hover: #ffffff;
            --user-card-border: rgba(37, 99, 235, 0.2);
            --primary-btn-bg: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #4338ca 100%);
            --toggle-bg: #ffffff;
            --toggle-border: #cbd5e1;
            --toggle-hover: #e0e7ff;
            --badge-bg: rgba(37, 99, 235, 0.08);
            --badge-border: rgba(37, 99, 235, 0.25);
            --divider-color: linear-gradient(90deg, rgba(37, 99, 235, 0) 0%, rgba(37, 99, 235, 0.3) 50%, rgba(37, 99, 235, 0) 100%);
            --glow-1: #38bdf8;
            --glow-2: #818cf8;
            --glow-opacity: 0.25;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.35s ease, border-color 0.35s ease, color 0.25s ease, box-shadow 0.35s ease, transform 0.25s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-glow {
            position: fixed;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            filter: blur(130px);
            opacity: var(--glow-opacity);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }
        .glow-1 { top: -120px; left: -100px; background: radial-gradient(circle, var(--glow-1), #0284c7); }
        .glow-2 { bottom: -120px; right: -100px; background: radial-gradient(circle, var(--glow-2), #8b5cf6); animation-delay: -4s; }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.18) translate(35px, -25px); }
        }

        .page-back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            width: 44px;
            height: 44px;
            background: var(--toggle-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--toggle-border);
            border-radius: 14px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .page-back-btn:hover {
            transform: translateX(-3px);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .theme-toggle-btn {
            background: var(--toggle-bg);
            border: 1px solid var(--toggle-border);
            color: var(--text-primary);
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
        }

        .theme-toggle-btn:hover {
            background: var(--toggle-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.25);
        }

        .header-title-sec {
            margin-bottom: 2rem;
        }

        .header-title-sec h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
            letter-spacing: -0.5px;
        }

        .header-title-sec p {
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        /* Top Counter Display Widget */
        .stats-counter-bar {
            background: var(--user-card-bg);
            border: 1px solid var(--user-card-border);
            border-radius: 20px;
            padding: 1.2rem 1.4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .counter-info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .counter-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .counter-text label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: block;
        }

        .counter-text span {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .live-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #10b981;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Section Separator Line between Counter and User Cards */
        .section-divider {
            height: 1px;
            width: 100%;
            background: var(--divider-color);
            margin: 1.8rem 0;
            border: none;
        }

        #display {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* User Card Layout */
        .user-card {
            background: var(--user-card-bg);
            border: 1px solid var(--user-card-border);
            border-radius: 20px;
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .user-card:hover {
            background: var(--user-card-hover);
            border-color: var(--card-border);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.25);
        }

        /* Left Side: Name and Avatar */
        .user-info-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .avatar {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.15rem;
        }

        .details {
            text-align: left;
        }

        .details .acc-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
        }

        .details h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Right Side: Change Password Button */
        .actions-right {
            display: flex;
            align-items: center;
        }

        .btn-change-password {
            background: var(--primary-btn-bg);
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.35rem;
            border-radius: 14px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px -4px rgba(0, 210, 255, 0.35);
        }

        .btn-change-password:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 12px 25px -2px rgba(0, 210, 255, 0.45);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            opacity: 0.7;
            color: var(--text-secondary);
        }

        @media (max-width: 600px) {
            .page-back-btn { top: 1rem; left: 1rem; width: 38px; height: 38px; }
            .container { padding: 1.6rem 1.2rem; }
            .user-card { padding: 1rem; flex-direction: column; gap: 1rem; align-items: stretch; }
            .user-info-left { width: 100%; }
            .actions-right { width: 100%; }
            .btn-change-password { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Back Button -->
    <a href="index.html" class="page-back-btn" title="Back to Home">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="container">
        
        <!-- Header Top -->
        <div class="header-top">
            <div class="header-badge">
                <i class="fa-solid fa-shield-halved"></i> Security Hub
            </div>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle Theme">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
                <span id="themeText">Dark</span>
            </button>
        </div>

        <!-- Header Title (Updated Title Name) -->
        <div class="header-title-sec">
            <h1>Password Security Center</h1>
            <p>Select an account below to manage credentials and security settings.</p>
        </div>

        <!-- Live Created Accounts Counter Bar -->
        <div class="stats-counter-bar">
            <div class="counter-info">
                <div class="counter-icon">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div class="counter-text">
                    <label>Total Registered Accounts</label>
                    <span><strong id="accountCount">0</strong> Users Joined</span>
                </div>
            </div>
            <div class="live-tag">
                <span class="live-dot"></span> Live DB
            </div>
        </div>

        <!-- Divider Line Separating Counter and Account List -->
        <hr class="section-divider">

        <!-- Dynamic User Cards List -->
        <div id="display">
            <div class="empty-state">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <p>Loading active accounts...</p>
            </div>
        </div>

    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script src="./passwordChange.js"></script>
</body>
</html>
